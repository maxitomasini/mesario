<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para la mujer más hermosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#2a1240;font-family:'Baloo 2','Trebuchet MS',sans-serif;color:#fff}
#start{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:radial-gradient(circle at 50% 40%,#ff7ab8,#7b2cbf 70%);transition:opacity 1s}
#start h1{font-size:clamp(1.5rem,6vw,2.4rem);font-weight:700;text-align:center;padding:0 20px;text-shadow:0 3px 0 rgba(0,0,0,.2)}
#heart{position:relative;width:min(62vw,260px);aspect-ratio:1;border:0;background:none;cursor:pointer;animation:beat 1.3s infinite;-webkit-tap-highlight-color:transparent}
#heart svg{width:100%;height:100%;filter:drop-shadow(0 10px 0 rgba(0,0,0,.2))}
#heart span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-bottom:8%;font:700 clamp(1.5rem,7vw,2.2rem)/1 'Baloo 2',sans-serif;color:#fff}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.1)}30%{transform:scale(1)}45%{transform:scale(1.07)}}
#stage{position:fixed;inset:0}
.scene{position:absolute;inset:0;opacity:0;transition:opacity 1.4s;overflow:hidden}
.scene.on{opacity:1}
.deco{position:absolute;line-height:1;animation:float 5s ease-in-out infinite;user-select:none}
.late{opacity:0;transition:opacity 2s}
.scene.sun .late{opacity:1}
.scene.sun .early{opacity:0;transition:opacity 2s}
@keyframes float{50%{transform:translateY(-14px) rotate(4deg)}}
@keyframes fall{from{transform:translateY(-12vh)}to{transform:translateY(112vh)}}
.drop{position:absolute;top:0;width:3px;height:18px;background:#bde3ff;border-radius:3px;opacity:.7;animation:fall .9s linear infinite}
.ground{position:absolute;left:0;right:0;bottom:0;height:26%}
.chars{position:absolute;left:0;right:0;bottom:11%;display:flex;justify-content:center;gap:clamp(8px,6vw,60px);z-index:3}
.troll{width:clamp(110px,30vw,180px);animation:hop 1.1s ease-in-out infinite}
.troll:nth-child(2){animation-delay:.35s}
.troll svg{width:100%;overflow:visible}
@keyframes hop{50%{transform:translateY(-16px) rotate(-3deg)}}
#text{position:absolute;z-index:10;left:50%;top:max(5vh,env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(92vw,640px);padding:18px 22px;border-radius:26px;background:rgba(30,10,50,.55);backdrop-filter:blur(6px);font-size:clamp(1.05rem,4.4vw,1.5rem);line-height:1.4;text-align:center;font-weight:500;transition:opacity 1s;opacity:0;pointer-events:none}
#text.show{opacity:1}
#text span{opacity:0;transition:opacity .6s}
#text span.v{opacity:1}
#end{position:fixed;inset:0;z-index:20;pointer-events:none}
.h{position:absolute;top:-10vh;animation:fall linear forwards}
@media (prefers-reduced-motion:reduce){.troll,.deco,#heart{animation:none}}
</style>
</head>
<body>
<div id="start">
  <h1>Para la mujer más hermosa</h1>
  <button id="heart" aria-label="Tocar">
    <svg viewBox="0 0 100 90"><path d="M50 86C20 62 4 46 4 28 4 14 15 4 28 4c9 0 17 5 22 13C55 9 63 4 72 4c13 0 24 10 24 24 0 18-16 34-46 58z" fill="#ff2e74" stroke="#fff" stroke-width="3"/></svg>
    <span>Tocar</span>
  </button>
</div>
<div id="stage"></div>
<div id="text"></div>
<div id="end"></div>
<audio id="song" src="song.mp3" loop preload="auto"></audio>

<script>
// ---------- Personajes estilo "trolls" (originales, dibujados en SVG) ----------
function troll(hair, skin, mood, body){
  const spikes=[[60,6,-32],[60,6,-16],[60,4,0],[60,6,16],[60,6,32],[60,14,-46],[60,14,46]]
    .map(s=>`<ellipse cx="${60+s[2]*1.5}" cy="${s[1]+14-Math.abs(s[2])/5}" rx="13" ry="30" fill="${hair}" transform="rotate(${s[2]} ${60+s[2]*1.5} ${s[1]+40})"/>`).join('');
  const eyes = mood==='love'
    ? `<text x="38" y="88" font-size="22">💖</text><text x="64" y="88" font-size="22">💖</text>`
    : `<circle cx="45" cy="78" r="10" fill="#fff"/><circle cx="75" cy="78" r="10" fill="#fff"/>
       <circle cx="${mood==='sad'?46:47}" cy="${mood==='sad'?81:79}" r="5" fill="#2a1240"/><circle cx="${mood==='sad'?74:73}" cy="${mood==='sad'?81:79}" r="5" fill="#2a1240"/>`;
  const brows = mood==='sad'
    ? `<path d="M34 64l20 6M86 64l-20 6" stroke="#2a1240" stroke-width="3" stroke-linecap="round"/>` : '';
  const tears = mood==='sad' ? `<ellipse cx="40" cy="98" rx="3" ry="6" fill="#7fd1ff"/><ellipse cx="80" cy="98" rx="3" ry="6" fill="#7fd1ff"/>` : '';
  const mouth = {
    sad:`<path d="M48 112q12-10 24 0" stroke="#2a1240" stroke-width="4" fill="none" stroke-linecap="round"/>`,
    happy:`<path d="M44 104q16 18 32 0z" fill="#8b1d4d"/>`,
    love:`<path d="M46 104q14 16 28 0" stroke="#2a1240" stroke-width="4" fill="#ff8fb3" stroke-linecap="round"/>`,
    calm:`<path d="M46 106q14 10 28 0" stroke="#2a1240" stroke-width="4" fill="none" stroke-linecap="round"/>`
  }[mood]||'';
  return `<svg viewBox="0 0 120 190"><g>${spikes}</g>
    <rect x="30" y="140" width="60" height="44" rx="22" fill="${body}"/>
    <circle cx="60" cy="90" r="42" fill="${skin}"/>
    <circle cx="30" cy="100" r="7" fill="#ff9ec4" opacity=".6"/><circle cx="90" cy="100" r="7" fill="#ff9ec4" opacity=".6"/>
    ${eyes}${brows}${tears}${mouth}</svg>`;
}
const E=(c,x,y,s,extra='')=>`<div class="deco ${extra}" style="left:${x}%;top:${y}%;font-size:${s}px;animation-delay:${(x*37%30)/10}s">${c}</div>`;
const rain=()=>Array.from({length:28},(_,i)=>`<div class="drop early" style="left:${i*3.7}%;animation-delay:${(i*.17)%1}s"></div>`).join('');

// ---------- Escenarios ----------
const scenes=[
 { // 1: buenos y malos momentos -> lluvia y luego arcoíris
  bg:'linear-gradient(#5b6b8c,#8a9bb8 60%,#6d8c5e 60%)',
  html:()=>rain()+E('☁️',8,22,90,'early')+E('☁️',62,28,110,'early')+E('🌈',22,30,210,'late')+E('☀️',72,26,100,'late')+E('🌷',10,70,40,'late')+E('🌷',84,72,44,'late'),
  chars:[['#ff5fa2','#7be0a3','sad','#ffd23f'],['#46c6ff','#ffb86b','sad','#ff7a59']],
  after:[['#ff5fa2','#7be0a3','happy','#ffd23f'],['#46c6ff','#ffb86b','happy','#ff7a59']]},
 { // 2: obstáculos juntos -> montaña con bandera
  bg:'linear-gradient(#7ad7ff,#d6f3ff 55%,#8ac26a 55%)',
  html:()=>`<svg class="ground" style="bottom:20%;height:46%" viewBox="0 0 400 200" preserveAspectRatio="none"><path d="M0 200L120 40 200 120 290 20 400 200z" fill="#7a6bb5"/><path d="M290 20l-24 36 24-10 20 14z" fill="#fff"/></svg>`
    +E('🚩',66,6,60)+E('🪨',6,62,56)+E('🪨',86,64,48)+E('☁️',10,10,80)+E('☁️',50,16,70)+E('⭐',40,34,34),
  chars:[['#b36bff','#ffd86b','happy','#ff5fa2'],['#ff8a3d','#8be0ff','happy','#46c6ff']]},
 { // 3: detalles simples -> mañana, café, flores
  bg:'linear-gradient(#ffd89b,#ffb4a2 50%,#ffe3b3 50%)',
  html:()=>E('🌅',34,18,150)+E('☕',8,60,64)+E('🥐',86,58,56)+E('🌻',16,72,60)+E('🌼',78,74,56)+E('💌',46,48,44)+E('🐦',70,14,44)+E('🐦',14,26,34),
  chars:[['#ff6f91','#a0e7a0','love','#ffc75f'],['#4fc3f7','#ffd6a5','happy','#f9f871']]},
 { // 4: momentos oscuros -> noche, luciérnagas, linterna
  bg:'linear-gradient(#0b0d3a,#2b1b6b 60%,#1f3d3a 60%)',
  html:()=>E('🌙',72,22,90)+E('✨',12,24,40)+E('✨',30,38,28)+E('✨',58,16,36)+E('✨',88,38,30)+E('🏮',34,52,48)+E('🌲',4,56,90)+E('🌲',86,52,100)+E('💛',44,40,26)+E('💛',60,50,22),
  chars:[['#ff5fa2','#b8f2c9','calm','#8e7dff'],['#ffd23f','#ffd1b3','love','#46c6ff']]},
 { // 5: mejoramos como pareja -> jardín de corazones
  bg:'linear-gradient(#ffb3d9,#ffe0f0 55%,#9be08a 55%)',
  html:()=>E('🌸',6,18,50)+E('🌸',88,22,56)+E('💗',20,34,44)+E('💞',72,38,44)+E('🌈',30,6,160)+E('🦋',50,48,40)+E('🌷',12,74,50)+E('🌷',82,74,50)+E('🌺',48,78,44),
  chars:[['#ff4d94','#8df0c1','love','#ffd23f'],['#6a5bff','#ffd0a8','love','#ff7a59']]},
 { // 6: gracias -> fuegos artificiales
  bg:'radial-gradient(circle at 50% 30%,#7b2cbf,#240b45 75%)',
  html:()=>E('🎆',10,12,100)+E('🎇',70,8,110)+E('🎆',40,30,80)+E('✨',86,40,40)+E('✨',6,46,40)+E('💖',46,12,50)+E('💖',22,60,36)+E('💖',78,58,36),
  chars:[['#ff4d94','#9ff0c8','love','#ffd23f'],['#46c6ff','#ffd9b0','love','#ff7a59']]}
];

const paras=[
 "Hoy cumplimos 6 meses. En este tiempo tuvimos buenos y malos momentos: algunos donde nos apoyamos mutuamente y otros donde no nos queríamos ni ver.",
 "Pero a pesar de todo seguimos adelante. Pasamos juntos cada obstáculo que se nos interpuso y aprendimos de ellos.",
 "En este tiempo aprendí a valorar detalles tan simples como un buenos días, un provecho, un «que la pases lindo». Detalles que muchas veces no valoramos, pero tú me enseñaste a valorar cada uno de ellos.",
 "Me enseñaste a ver lo positivo en los momentos más oscuros. He aprendido mucho y es gracias a ti: cambió mi forma de ver el mundo y me hiciste mejorar.",
 "Y lo mejor de todo es que mejoramos como pareja. Aunque tengamos nuestros defectos, siempre buscamos la forma de mejorar entre los dos.",
 "Gracias, amor. Gracias por todos los momentos lindos que hemos pasado, gracias por estar siempre presente, gracias por todo. Te amo con todo mi corazón. :)"
];

const stage=document.getElementById('stage'), box=document.getElementById('text'), song=document.getElementById('song');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const charsHTML=a=>a.map(c=>`<div class="troll">${troll(...c)}</div>`).join('');
const els=scenes.map(s=>{
  const d=document.createElement('div');d.className='scene';d.style.background=s.bg;
  d.innerHTML=s.html()+`<div class="chars">${charsHTML(s.chars)}</div>`;
  stage.appendChild(d);return d;
});

async function play(){
  for(let i=0;i<paras.length;i++){
    const sc=els[i], data=scenes[i];
    els.forEach(e=>e.classList.remove('on'));
    sc.classList.add('on');
    const words=paras[i].split(' ');
    box.innerHTML=words.map(w=>`<span>${w} </span>`).join('');
    box.classList.add('show');
    const spans=[...box.children];
    for(let k=0;k<spans.length;k++){
      spans[k].classList.add('v');
      if(data.after && k===Math.floor(spans.length*0.55)){
        sc.classList.add('sun');
        sc.querySelector('.chars').innerHTML=charsHTML(data.after);
      }
      await wait(260);
    }
    if(i===paras.length-1){ lovers(); return; }
    await wait(2600);
    box.classList.remove('show');
    await wait(1100);
  }
}
function lovers(){
  const end=document.getElementById('end');
  setInterval(()=>{
    const h=document.createElement('div');h.className='h';
    h.textContent=['💖','💗','💕','❤️'][Math.random()*4|0];
    h.style.left=Math.random()*95+'%';h.style.fontSize=(18+Math.random()*26)+'px';
    h.style.animationDuration=(4+Math.random()*4)+'s';
    end.appendChild(h);setTimeout(()=>h.remove(),8500);
  },350);
}
document.getElementById('heart').addEventListener('click',()=>{
  song.volume=.9; song.play().catch(()=>{});
  const s=document.getElementById('start'); s.style.opacity=0;
  setTimeout(()=>{s.remove();play();},900);
});
</script>
</body>
</html>
